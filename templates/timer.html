{% extends "base.html" %}
{% block title %}🎮Таймер — GameBalance{% endblock %}
{% block content %}
<div class="card">
  <h2>Таймер</h2>
  <p>50 минут игры → 10 минут перерыва</p>

  <div style="margin: 2rem 0; text-align: center;">
    <div id="display" style="font-size: 4rem; font-weight: 700; margin: 1rem 0; color: #4f46e5;">50:00</div>

    <div style="margin-top: 1rem;">
      <button id="control-btn" class="btn">▶ Начать</button>
      <button id="reset-btn" class="btn btn-secondary" style="margin-left: 10px;">⏹ Сбросить</button>
      <button id="stop-btn" class="btn" style="margin-left: 10px; background: #666; opacity: 0.5; cursor: not-allowed;" disabled>✓ Завершить</button>
    </div>
  </div>

  <p><strong>💡 Подсказка:</strong> Таймер работает в фоновом режиме.</p>
</div>

<audio id="alarm-sound" preload="auto">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3" type="audio/mpeg">
</audio>

<style>
.btn-success {
  background: #10b981 !important;
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
}
.btn-success:hover {
  background: #059669 !important;
}
</style>

<script>
let startTime = null;
let timeLeft = 50 * 60;
let isRunning = false;
let targetEndTime = null;
let tickInterval = null;
let notified = false;
let pausedTimeLeft = null;

function updateDisplay() {
  if (isNaN(timeLeft) || timeLeft === null) {
    timeLeft = 50 * 60;
  }

  const absTime = Math.abs(timeLeft);
  const mins = Math.floor(absTime / 60).toString().padStart(2, '0');
  const secs = (absTime % 60).toString().padStart(2, '0');

  if (timeLeft >= 0) {
    document.getElementById('display').textContent = `${mins}:${secs}`;
    document.getElementById('display').style.color = '#4f46e5';
  } else {
    document.getElementById('display').textContent = `+${mins}:${secs}`;
    document.getElementById('display').style.color = '#e74c3c';
  }
}

function updateButtons() {
  const controlBtn = document.getElementById('control-btn');
  const stopBtn = document.getElementById('stop-btn');

  if (isRunning) {
    controlBtn.textContent = '⏸ Пауза';
    stopBtn.disabled = false;
    stopBtn.style.opacity = '1';
    stopBtn.style.cursor = 'pointer';
    stopBtn.classList.add('btn-success');
  } else {
    controlBtn.textContent = '▶ Продолжить';
    if (startTime) {
      stopBtn.disabled = false;
      stopBtn.style.opacity = '1';
      stopBtn.style.cursor = 'pointer';
      stopBtn.classList.add('btn-success');
    }
  }
}

function playAlarm() {
  const audio = document.getElementById('alarm-sound');
  audio.currentTime = 0;
  audio.play().catch(e => console.log("Звук отключен"));
}

function showNotification() {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('GameBalance', { body: '⏰ Время вышло! Сделайте перерыв.' });
  }
}

function tick() {
  if (!isRunning) return;

  const now = Date.now();
  const remaining = Math.floor((targetEndTime - now) / 1000);

  if (!isNaN(remaining)) {
    timeLeft = remaining;
    updateDisplay();
  }

  if (timeLeft === 0 && !notified) {
    showNotification();
    playAlarm();
    notified = true;
  }
}

function startTimer() {
  if (tickInterval) {
    clearInterval(tickInterval);
  }

  if (!startTime) {
    startTime = Date.now();
    targetEndTime = startTime + timeLeft * 1000;
    notified = false;
  } else if (pausedTimeLeft !== null) {
    targetEndTime = Date.now() + pausedTimeLeft * 1000;
    timeLeft = pausedTimeLeft;
  }

  isRunning = true;
  pausedTimeLeft = null;
  updateButtons();
  tickInterval = setInterval(tick, 100);
  saveState();
}

function pauseTimer() {
  if (!isRunning) return;
  isRunning = false;
  if (tickInterval) {
    clearInterval(tickInterval);
    tickInterval = null;
  }
  pausedTimeLeft = timeLeft;
  updateButtons();
  saveState();
}

async function stopTimer() {
  if (!startTime) return;

  if (tickInterval) {
    clearInterval(tickInterval);
    tickInterval = null;
  }
  isRunning = false;

  const actualMs = Date.now() - startTime;
  let actualHours = parseFloat((actualMs / 3600000).toFixed(2));

  if (actualHours <= 0) {
    actualHours = 0.01;
  }

  try {
    const response = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        game_name: 'Dota 2',
        hours_played: actualHours,
        mood_score: null,
        notes: ''
      })
    });

    if (!response.ok) {
      const errorData = await response.json();
      console.error('Ошибка валидации:', errorData);
      alert('Ошибка сохранения: ' + JSON.stringify(errorData));
      return;
    }

    console.log('Сессия сохранена:', actualHours, 'часов');
  } catch (e) {
    console.error('Ошибка сети:', e);
  }

  startTime = null;
  timeLeft = 50 * 60;
  notified = false;
  targetEndTime = null;
  pausedTimeLeft = null;
  isRunning = false;

  updateDisplay();

  const controlBtn = document.getElementById('control-btn');
  const stopBtn = document.getElementById('stop-btn');

  controlBtn.textContent = '▶ Начать';
  stopBtn.disabled = true;
  stopBtn.style.opacity = '0.5';
  stopBtn.style.cursor = 'not-allowed';
  stopBtn.classList.remove('btn-success');

  sessionStorage.removeItem('gamebalance_timer');
  window.location.href = '/stats';
}

function resetTimer() {
  if (tickInterval) {
    clearInterval(tickInterval);
    tickInterval = null;
  }

  isRunning = false;
  startTime = null;
  timeLeft = 50 * 60;
  notified = false;
  targetEndTime = null;
  pausedTimeLeft = null;

  updateDisplay();

  const controlBtn = document.getElementById('control-btn');
  const stopBtn = document.getElementById('stop-btn');

  controlBtn.textContent = '▶ Начать';
  stopBtn.disabled = true;
  stopBtn.style.opacity = '0.5';
  stopBtn.style.cursor = 'not-allowed';
  stopBtn.classList.remove('btn-success');

  sessionStorage.removeItem('gamebalance_timer');
}

function loadState() {
  const saved = sessionStorage.getItem('gamebalance_timer');
  if (saved) {
    try {
      const state = JSON.parse(saved);

      startTime = state.startTime || null;
      targetEndTime = state.targetEndTime || null;
      isRunning = state.isRunning || false;
      notified = state.notified || false;
      pausedTimeLeft = state.pausedTimeLeft || null;

      if (!isRunning && pausedTimeLeft !== null) {
        timeLeft = pausedTimeLeft;
      } else if (isRunning && targetEndTime) {
        const now = Date.now();
        timeLeft = Math.floor((targetEndTime - now) / 1000);
      } else {
        timeLeft = 50 * 60;
      }

      updateDisplay();
      updateButtons();

      if (isRunning) {
        if (tickInterval) {
          clearInterval(tickInterval);
        }
        tickInterval = setInterval(tick, 100);
      }
      return;
    } catch (e) {
      console.error('Ошибка восстановления состояния:', e);
    }
  }

  timeLeft = 50 * 60;
  updateDisplay();
  updateButtons();
}

function saveState() {
  sessionStorage.setItem('gamebalance_timer', JSON.stringify({
    timeLeft,
    isRunning,
    startTime,
    targetEndTime,
    notified,
    pausedTimeLeft
  }));
}

// Обработка переключения вкладок
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    saveState();
  } else {
    loadState();
  }
});

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
  loadState();

  document.getElementById('control-btn').addEventListener('click', () => {
    if (isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    resetTimer();
    sessionStorage.removeItem('gamebalance_timer');
  });

  document.getElementById('stop-btn').addEventListener('click', stopTimer);

  window.addEventListener('beforeunload', saveState);

  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
});
</script>
{% endblock %}
